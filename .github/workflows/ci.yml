name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [model-service, prediction-service, ui-gateway-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint, docker-build]
    steps:
      - name: Checkout code
        uses:  actions/checkout@v4

      - name: Create models directory
        run: mkdir -p models

            - name: Build services with docker compose
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Check services are running
        run: docker compose ps

      - name: Test Services Health
        run: |
          # Function to check service health
          check_service_health() {
            local service_name=$1
            local url=$2
            echo "Testing $service_name health..."
            for i in {1..10}; do
              if curl -f $url; then
                echo "✓ $service_name is healthy"
                return 0
              fi
              echo "Attempt $i failed, retrying..."
              sleep 5
            done
            echo "✗ $service_name health check failed"
            docker compose logs $service_name
            return 1
          }
          
          # Check all services
          check_service_health "model-service" "http://localhost:5001/health"
          check_service_health "prediction-service" "http://localhost:5002/health"
          check_service_health "ui-gateway-service" "http://localhost:5000/"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
