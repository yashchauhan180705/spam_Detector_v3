name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [model-service, prediction-service, ui-gateway-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Check ${{ matrix.service }} dependencies
        run: |
          if [ -f "${{ matrix.service }}/requirements.txt" ]; then
            safety check -r ${{ matrix.service }}/requirements.txt --json || true
          fi

  docker-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [model-service, prediction-service, ui-gateway-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:scan ./${{ matrix.service }}

      - name: Run Trivy scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:scan
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  code-quality-check:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint radon

      - name: Run pylint
        run: |
          find . -name "*.py" -not -path "*/venv/*" -not -path "*/.env/*" | xargs pylint --exit-zero || echo "Pylint analysis complete"

      - name: Calculate code complexity
        run: |
          radon cc . -a --total-average || echo "Complexity analysis complete"
          radon mi . --min B || echo "Maintainability analysis complete"
